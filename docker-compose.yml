services:
  postgres:
    image: postgres:17

    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env.backend

    volumes:
      - /opt/apps/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - app-network

  redis:
    image: redis:8-alpine

    container_name: redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - /opt/apps/redis:/data

    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - app-network

  backend:
    build:
      context: ./BE-backend
      dockerfile: Dockerfile.prod

    container_name: backend

    restart: unless-stopped

    env_file:
      - .env.backend

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    expose:
      - '5000'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - app-network

  frontend:
    build:
      context: ./FE-insidia
      dockerfile: Dockerfile.prod

    container_name: frontend

    restart: unless-stopped

    env_file:
      - .env.frontend

    depends_on:
      backend:
        condition: service_started

    expose:
      - '3000'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
